name: FUT Monitor Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'  # uruchamia się co 2 godziny (lub tak jak masz ustawione)

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests cloudscraper

    - name: Run python bot.py
      run: python bot.py

    - name: Commit updated config
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update alert flags"
        branch: main
      - name: Commit state changes back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatyczna aktualizacja statusu alertów bota"
